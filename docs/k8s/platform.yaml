apiVersion: apps/v1
kind: Deployment
metadata:
  name: skill2hire-api
spec:
  replicas: 2
  selector:
    matchLabels: { app: skill2hire-api }
  template:
    metadata:
      labels: { app: skill2hire-api }
    spec:
      containers:
        - name: api
          image: skill2hire-api:latest
          ports: [{ containerPort: 8000 }]
          envFrom: [{ secretRef: { name: skill2hire-secrets } }]
          readinessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 5 }
---
apiVersion: v1
kind: Service
metadata:
  name: skill2hire-api
spec:
  selector: { app: skill2hire-api }
  ports: [{ port: 8000, targetPort: 8000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: skill2hire-api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: skill2hire-api }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
